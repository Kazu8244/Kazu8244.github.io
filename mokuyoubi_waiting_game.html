header{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;justify-content:space-between;font-weight:800;color:white;text-shadow:0 2px 5px #000}
#title{position:absolute;top:16%;width:100%;text-align:center;color:white;text-shadow:0 3px 10px #123;font-size:32px;font-weight:900}
#sub{font-size:15px;margin-top:8px}
.item{position:absolute;font-size:54px;filter:drop-shadow(0 4px 5px #2348);cursor:pointer;animation:fall linear forwards;user-select:none}
@keyframes fall{from{transform:translateY(-90px) rotate(-12deg)}to{transform:translateY(calc(100dvh + 100px)) rotate(18deg)}}
#start{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:17px 28px;font-size:21px;font-weight:900;background:white;color:#0759a8;box-shadow:0 8px 30px #1237}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#07284bd9;color:white;text-align:center;padding:30px}
.card{background:#ffffff18;border:1px solid #ffffff55;border-radius:24px;padding:28px;width:90%;backdrop-filter:blur(8px)}
.big{font-size:34px;font-weight:900}.small{line-height:1.7}
button{touch-action:manipulation}
.pop{position:absolute;color:white;font-size:25px;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none;animation:pop .7s forwards}
@keyframes pop{to{transform:translateY(-60px) scale(1.3);opacity:0}}
</style>
</head>
<body><main id="game"><div class="bg"></div>
<header><div>得点 <span id="score">0</span></div><div>残り <span id="time">30</span>秒</div></header>
<div id="title">木曜日の待合室<div id="sub">いい物をタップ！ 💩だけは触るな！</div></div>
<button id="start">診察待ちスタート！</button>
<div id="msg"><div class="card"><div class="big" id="result"></div><p class="small" id="comment"></p><button id="again">もう一回 🤣</button></div></div>
</main>
<script>
const game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');
let score=0,time=30,running=false,timer,spawner;
const goodies=[['☕',10],['🐶',30],['💊',10],['🎫',15],['🌊',20],['💙',25],['🍣',20]];
function spawn(){
 if(!running)return;
 const bad=Math.random()<.18;
 const [icon,pts]=bad?['💩',-100]:goodies[Math.floor(Math.random()*goodies.length)];
 const e=document.createElement('div'); e.className='item';e.textContent=icon;
 e.style.left=(5+Math.random()*82)+'%';e.style.animationDuration=(2.1+Math.random()*2.2)+'s';
 e.onclick=ev=>{score+=pts;scoreEl.textContent=score;pop(ev.clientX,ev.clientY,(pts>0?'+':'')+pts);e.remove();};
 e.onanimationend=()=>e.remove(); game.appendChild(e);
}
function pop(x,y,t){let p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=(x-25)+'px';p.style.top=(y-25)+'px';game.appendChild(p);setTimeout(()=>p.remove(),700)}
function start(){
 document.querySelector('#title').style.display='none';document.querySelector('#start').style.display='none';document.querySelector('#msg').style.display='none';
 score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;
 spawner=setInterval(spawn,520);
 timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000);
}
function finish(){
 running=false;clearInterval(timer);clearInterval(spawner);document.querySelectorAll('.item').forEach(x=>x.remove());
 let c=score>=500?'待合室マスター！もう金曜日でいいレベル。':score>=250?'いい木曜日！かなり待ててる。':'💩に気を取られすぎだ！🤣';
 document.querySelector('#result').textContent='結果 '+score+'点！';document.querySelector('#comment').textContent=c;
 document.querySelector('#msg').style.display='flex';
}
document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;
</script></main></body></html>
