<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BlueCaveのJOURNAL。制作の過程、試行錯誤、日々の小さな発見を少しずつ記録していきます。">
  <title>JOURNAL — BlueCave</title>
  <link rel="stylesheet" href="assets/css/bluecave-v2.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へスキップ</a>
  <header class="site-header container">
    <a class="brand" href="index.html" aria-label="BlueCave ホーム">BlueCave<span class="brand-dot">.</span></a>
    <nav class="site-nav" aria-label="メインナビゲーション">
      <a href="index.html">HOME</a>
      <a href="works.html">WORKS</a>
      <a href="journal.html" aria-current="page">JOURNAL</a>
    </nav>
  </header>

  <main id="main" class="container page-main">
    <header class="page-heading">
      <p class="eyebrow">NOTES ALONG THE WAY</p>
      <h1>JOURNAL</h1>
      <p>日々の思考、興味、好奇心。<br>ものづくりの背景にある考えや、何気ない日常から生まれた発見を記録する場所。</p>
    </header>

    <section class="journal-section section-border" aria-labelledby="entries-title">
      <div class="listing-heading">
        <h2 id="entries-title">日々の記録</h2>
      </div>
      <!-- 最初の記事を公開したら、このempty-stateを削除します。 -->
      <div class="empty-state">
        <p class="eyebrow">COMING SOON</p>
        <h3>最初の記録を、準備中です。</h3>
        <p>うまくいったことも、思いどおりにいかなかったことも。<br>ものづくりの途中にある気づきを、ここに残していきます。</p>
        <a class="text-link" href="works.html">作品を見る <span aria-hidden="true">↗</span></a>
      </div>

      <div class="journal-list">
        <!-- 記事追加用テンプレート：このコメント内のarticleをコピーして、コメントの外に置きます。
        公開日・固有のid・タイトル・カテゴリ・本文を実際の内容に置き換えてください。
        <article class="journal-entry" id="your-entry-id">
          <div class="entry-meta">
            <time datetime="2026-10-27">2026.10.27</time>
            <span>制作ノート</span>
          </div>
          <div class="entry-body">
            <h3>記事のタイトル</h3>
            <p>ここに記事の本文を記入します。段落はp要素を追加します。</p>
          </div>
        </article>
        -->
      </div>
    </section>
  </main>

  <footer class="site-footer container">
    <p class="footer-brand">BlueCave</p>
    <p>© 2026 BlueCave / Kazu8244</p>
  </footer>
</body>
</html>
